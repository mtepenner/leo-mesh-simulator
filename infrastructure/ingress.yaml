apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leo-mesh-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: leo-mesh.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mesh-dashboard
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: routing-daemon
            port:
              number: 8000
